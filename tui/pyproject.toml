[project]
name = "jawa-tui"
version = "0.2.0"
description = "Interface de terminal do Jawa, o limpador de disco para desenvolvedores no Linux"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Otavio Fachin", email = "otaviofachin25@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
jawa-tui = "jawa_tui.app:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
strict = true
disallow_any_explicit = true
disallow_any_expr = false
python_version = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
