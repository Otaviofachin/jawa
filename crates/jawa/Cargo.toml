[package]
name = "jawa"
description = "Limpador de disco para desenvolvedores no Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
which.workspace = true
clap.workspace = true
crossterm.workspace = true
jawa-core.workspace = true
ratatui.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
jawa-core = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.deb]
maintainer = "Otavio Fachin <otaviofachin25@gmail.com>"
copyright = "2026, Otavio Fachin"
license-file = ["../../LICENSE", "0"]
section = "utils"
priority = "optional"
extended-description = """\
Jawa encontra o que as ferramentas de desenvolvimento acumulam no disco \
(caches, builds, node_modules parados, Docker), explica cada item e só \
apaga depois de várias verificações de segurança. Nunca roda como root."""
depends = "$auto"
assets = [
    ["target/release/jawa", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/jawa/README.md", "644"],
]
