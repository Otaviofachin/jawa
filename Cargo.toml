[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
dirs = "7"
which = "8"
walkdir = "2.5"
trash = "5.2"
rustix = { version = "1.1", features = ["fs", "process"] }
fs4 = "1.1"
sha2 = "0.11"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
tempfile = "3"
jawa-core = { path = "crates/jawa-core" }
